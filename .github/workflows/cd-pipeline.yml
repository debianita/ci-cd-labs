name: CD Pipeline to LocalStack (staging and production)

on:
  push:
    branches:
      - staging
  workflow_dispatch: {}
  release:
    types: published

env:
  PORT: 5001
  IMAGE: ${{ vars.IMAGE }}:${{ github.sha }}
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: us-east-1

jobs:
  test:
    runs-on: ubuntu-latest
    name: Setup, test, and build project
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm ci

      - name: Test application
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    name: Build Docker image and deploy to LocalStack
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Authenticate for Docker Hub
        env:
          D_USER: ${{secrets.DOCKER_USER}}
          D_PASS: ${{secrets.DOCKER_PASSWORD}}
        run: docker login -u $D_USER -p $D_PASS

      - name: Build and tag Image
        run: docker build -t ${{env.IMAGE}} .

      - name: Push the image to Docker hub
        run: docker push ${{env.IMAGE}}

      # Levantar LocalStack manualmente
      - name: Start LocalStack
        run: docker run -d -p 4566:4566 -p 4571:4571 localstack/localstack

      - name: Install AWS CLI
        run: pip install awscli

      - name: Wait for LocalStack
        run: |
          echo "Esperando LocalStack..."
          sleep 40
          curl http://localhost:4566/_localstack/health || true
          aws --endpoint-url=http://localhost:4566 --region us-east-1 s3 ls || true

      - name: Deploy to LocalStack - Production environment
        if: github.event_name == 'release' && github.event.action == 'published' && github.event.release.target_commitish == 'main'
        run: |
          echo "Deploying to LocalStack Production"
          aws --endpoint-url=http://localhost:4566 ecs create-cluster --cluster-name myapp-prod
          aws --endpoint-url=http://localhost:4566 ecs register-task-definition \
            --family myapp-prod \
            --network-mode bridge \
            --container-definitions '[{"name":"myapp","image":"${{env.IMAGE}}","memory